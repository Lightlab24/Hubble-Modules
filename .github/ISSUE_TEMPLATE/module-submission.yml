name: Module submission
description: Send a module in for testing, review and official distribution
title: "Module submission: "
body:
  - type: markdown
    attributes:
      value: >-
        New to Hubble modules? See
        [Build a Hubble module: start here](https://github.com/Lightlab24/Hubble-Modules/blob/main/docs/getting-started.md).
  - type: textarea
    id: package
    attributes:
      label: Package for testing
      description: >-
        Drag in your .hubble-module file. Zip it first, because GitHub only accepts
        certain file types. Leave this empty if you give a source repository below.
  - type: input
    id: source
    attributes:
      label: Source repository and exact commit or tag
      description: Needed before an official release. Optional for a first test if you attached the package.
  - type: textarea
    id: capabilities
    attributes:
      label: Equipment, actions, feedback, and observed completion
      description: Explain supported features and what success confirms.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Tests and compatibility
      description: Include simulator tests, hardware tested, reload behavior, saved ID compatibility, and license.
    validations:
      required: true
