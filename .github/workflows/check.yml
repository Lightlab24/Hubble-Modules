name: Check module submissions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: node --test test/*.test.mjs
      - name: Test submitted portable projects without publication credentials
        run: node scripts/check-submissions.mjs
