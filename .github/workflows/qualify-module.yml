name: Qualify module candidate
on:
  workflow_dispatch:
    inputs:
      module:
        description: Module source directory name
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.22.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build and test the selected source
        env:
          MODULE_DIRECTORY: ${{ inputs.module }}
        run: node scripts/modules.mjs package "$MODULE_DIRECTORY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-module-candidate
          path: artifacts/
          if-no-files-found: error
