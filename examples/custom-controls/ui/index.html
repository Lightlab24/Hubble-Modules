<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Controls example</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main id="root">
      <section>
        <h1>Inputs</h1>
        <div id="record"></div>
        <div id="bus"></div>
        <div id="preset"></div>
        <div id="cue"></div>
        <div id="source"></div>
        <div id="color"></div>
      </section>
      <section>
        <h1>Buttons</h1>
        <div class="row">
          <div id="take"></div>
          <div id="ftb"></div>
          <div id="clear"></div>
        </div>
        <h1>Pan and tilt</h1>
        <div id="ptz"></div>
        <h1>State</h1>
        <div class="row">
          <div id="lamp"></div>
          <div id="meter" class="grow"></div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
