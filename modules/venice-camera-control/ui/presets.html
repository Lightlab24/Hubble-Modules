<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VENICE Presets</title><link rel="stylesheet" href="/api/module-controls/theme-v1.css"><link rel="stylesheet" href="./presets.css"></head>
<body>
<div class="camera-app presets-app" id="app">
  <header class="app-header">
    <div class="app-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h8.5M17.5 6.5H20M4 12h2.5M11.5 12H20M4 17.5h10.5M19.5 17.5H20"/><circle cx="15" cy="6.5" r="2.5"/><circle cx="9" cy="12" r="2.5"/><circle cx="17" cy="17.5" r="2.5"/></svg><div><h1>Presets</h1><p>Sony VENICE 2</p></div></div>
    <div class="header-status"><span class="status-dot"></span><span id="fleet-status">Loading workspace…</span></div>
  </header>
  <div class="toolbar" role="toolbar" aria-label="Preset controls">
    <button id="new-preset" title="Add a camera role. It starts the same as Base, with the next camera letter."><span aria-hidden="true">+</span> New preset</button>
    <button id="capture" aria-haspopup="menu" title="Read every setting from a camera into Base or a new preset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Capture from camera<span class="chevron" aria-hidden="true">▾</span></button>
    <span class="toolbar-divider"></span>
    <span class="toolbar-word">Send</span>
    <button id="pick-preset" class="picker" aria-haspopup="menu" aria-label="Preset to send"><b id="pick-preset-name">Choose preset</b><span class="chevron" aria-hidden="true">▾</span></button>
    <span class="toolbar-word">to</span>
    <button id="pick-camera" class="picker" aria-haspopup="menu" aria-label="Camera to send it to"><b id="pick-camera-name">Choose camera</b><small id="pick-camera-host"></small><span class="chevron" aria-hidden="true">▾</span></button>
    <button id="send" class="primary" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13M12 6l6 6-6 6"/></svg><span id="send-label">Send</span></button>
    <button id="stop" hidden>Stop</button>
    <span class="toolbar-spacer"></span>
    <div id="text-size" aria-label="Preset text size"></div>
    <button id="expand-all">Expand all</button><button id="collapse-all">Collapse all</button>
    <div id="column-editor" title="Choose which settings show"></div>
  </div>
  <div id="error" class="notice error" role="alert" hidden></div>
  <main class="work-area">
    <div class="sheet-scroll" id="viewport"><table id="camera-grid" role="grid" aria-label="Camera presets" tabindex="0" data-orientation="columns"><colgroup></colgroup></table></div>
    <div id="loading" class="loading" role="status">Connecting to workspace…</div>
  </main>
  <footer class="app-footer"><output id="save-status" aria-live="polite">Loading…</output><span title="Pinch or Ctrl+scroll to zoom the whole sheet"><output id="zoom-status" aria-label="Preset zoom">100%</output> · Pinch to zoom</span><span id="send-status" aria-live="polite"></span></footer>
</div>
<script type="module" src="./presets.js"></script>
</body></html>
